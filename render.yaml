# Blueprint Render pour l'API ONLOUTOU (provisoire ; meme image Docker sur DigitalOcean ensuite).
services:
  - type: web
    name: onloutou-api
    runtime: docker
    plan: free            # passer a "starter" avant la mise en production (le plan free s'endort)
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onloutou-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://www.onloutou.com
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # Stockage des fichiers (DigitalOcean Spaces ou autre S3) : a renseigner dans le tableau de bord.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: fra1
      - key: S3_BUCKET_PUBLIC
        sync: false
      - key: S3_BUCKET_PRIVATE
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: onloutou-db
    plan: free            # expire apres 30 jours : passer a "basic-256mb" ou migrer vers DigitalOcean
    region: frankfurt
    databaseName: onloutou
    user: onloutou
