# Blueprint Render pour l'API ONLOUTOU (provisoire ; meme image Docker sur DigitalOcean ensuite).
services:
  - type: web
    name: onloutou-api
    runtime: docker
    plan: free            # passer a "starter" avant la mise en production (le plan free s'endort)
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onloutou-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://www.onloutou.com
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # Cloudinary (photos et pieces confidentielles) : a renseigner dans le tableau de bord.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Brevo (e-mails via API HTTPS) : sans cle, l'envoi est simplement desactive.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false

databases:
  - name: onloutou-db
    plan: free            # expire apres 30 jours : passer a "basic-256mb" ou migrer vers DigitalOcean
    region: frankfurt
    databaseName: onloutou
    user: onloutou
