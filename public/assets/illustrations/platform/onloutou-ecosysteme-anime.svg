<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" class="onl-art" role="img" aria-labelledby="eco-title eco-desc">
      <title id="eco-title">ONLOUTOU — Louer, connecter et construire</title>
      <desc id="eco-desc">Trois scènes originales reliées par un flux jaune : équipements, géolocalisation et développement de solutions numériques. Des signaux et des liaisons s’animent doucement.</desc>
      <defs>
        <pattern id="eco-grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".08"/></pattern>
        <linearGradient id="eco-metal" x2="0" y2="1"><stop stop-color="#424640"/><stop offset="1" stop-color="#20231f"/></linearGradient>
      </defs>
      <style>
        .onl-art{display:block;width:100%;height:auto;font-family:Arial,sans-serif}
        .onl-art .ink{fill:#f8f8f2}.onl-art .muted{fill:#a2a69c}.onl-art .yellow{fill:#f5c400}
        .onl-art .caption{font-size:24px;font-weight:600;letter-spacing:1px}.onl-art .small{font-size:18px}
        .onl-art .flow{stroke-dasharray:9 170;animation:onl-flow 7s linear infinite}
        .onl-art .float{animation:onl-float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
        .onl-art .pulse{animation:onl-pulse 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
        .onl-art .blink{animation:onl-blink 4s ease-in-out infinite}
        @keyframes onl-flow{to{stroke-dashoffset:-716}}
        @keyframes onl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
        @keyframes onl-pulse{0%{transform:scale(.7);opacity:.65}80%,100%{transform:scale(1.65);opacity:0}}
        @keyframes onl-blink{0%,100%{opacity:.35}50%{opacity:1}}
        @media(prefers-reduced-motion:reduce){.onl-art *{animation:none!important}}
        @media(max-width:480px){.onl-art .small,.onl-art .detail{display:none}.onl-art .caption{font-size:38px}}
      </style>
