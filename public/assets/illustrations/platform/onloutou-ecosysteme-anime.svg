      <rect width="1200" height="690" rx="24" fill="url(#eco-grid)"/>
      <path d="M0 564Q490 460 1200 558V690H0Z" fill="#1d1d1d"/>
      <text x="64" y="64" class="yellow" font-size="28" font-weight="700" letter-spacing="3">ONLOUTOU</text>
      <text x="64" y="112" class="ink" font-size="35" font-weight="600">Le terrain rencontre la technologie.</text>
